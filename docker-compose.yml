version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: repairharnees-postgres
    environment:
      POSTGRES_DB: repairharnees
      POSTGRES_USER: repair
      POSTGRES_PASSWORD: repair
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repair -d repairharnees"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repairharnees-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: repairharnees
      DB_USER: repair
      DB_PASSWORD: repair
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repairharnees-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
